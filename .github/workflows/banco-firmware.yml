name: Build banco firmware

on:
  workflow_dispatch:
  push:
    branches: [banco-app]

permissions:
  contents: read

env:
  ESP_IDF_REVISION: 7b9cc1ac79f865983f59bb8ff3ff43eb74ff1dbe

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    name: Build banco firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize application dependencies
        run: >-
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init --recursive submodule/esp-mosaico-bsp submodule/esp-mosaico-utils submodule/raylib-lite-engine

      - name: Create build log directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/idf-logs/banco"

      - name: Set up ESP-IDF Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check out pinned ESP-IDF revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: espressif/esp-idf
          ref: ${{ env.ESP_IDF_REVISION }}
          path: .idf/esp-idf
          submodules: recursive
          persist-credentials: false

      - name: Install ESP-IDF tools
        shell: bash
        run: |
          export IDF_PATH="$GITHUB_WORKSPACE/.idf/esp-idf"
          export IDF_TOOLS_PATH="$RUNNER_TEMP/espressif"
          "$IDF_PATH/install.sh" all
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: Prepare pinned GSP compiler
        run: |
          python -m pip install --disable-pip-version-check esp-gsp-tools==0.1.1
          python submodule/esp-mosaico-utils/tools/ci/prepare_gsp.py --compiler-only

      - name: Verify pinned ESP-IDF revision
        shell: bash
        run: |
          if [[ -z "${IDF_PATH:-}" ]]; then
            echo "ESP-IDF installer did not export IDF_PATH"
            exit 1
          fi
          actual_revision="$(git -C "$IDF_PATH" rev-parse HEAD)"
          if [[ "$actual_revision" != "$ESP_IDF_REVISION" ]]; then
            echo "Expected ESP-IDF revision: $ESP_IDF_REVISION"
            echo "Actual ESP-IDF revision:   $actual_revision"
            exit 1
          fi

      - name: Verify ESP-IDF environment
        shell: bash
        run: >-
          python3 submodule/esp-mosaico-utils/mosaico-tools/skills/idf-low-noise-build/scripts/idf_low_noise_build.py
          --project "projects/banco"
          doctor

      - name: Build firmware
        shell: bash
        run: >-
          python3 submodule/esp-mosaico-utils/mosaico-tools/skills/idf-low-noise-build/scripts/idf_low_noise_build.py
          --project "projects/banco"
          --log-dir "$RUNNER_TEMP/idf-logs/banco"
          build

      - name: Build the Iris System Update bundle
        shell: bash
        run: |
          # The bundle is the supported install package: it keeps the Recovery
          # (Vibe Mode) partitions untouched and installs the app into ota_0.
          python -m venv "$RUNNER_TEMP/iris-venv"
          "$RUNNER_TEMP/iris-venv/bin/python" -m pip install --disable-pip-version-check \
            -r submodule/esp-mosaico-utils/ESP-Iris/components/esp_iris/tools/requirements.lock
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -C projects/banco -B projects/banco/build \
            -D "ESP_IRIS_PYTHON=$RUNNER_TEMP/iris-venv/bin/python" \
            system-update-bundle
          mkdir -p dist
          cp projects/banco/build/banco-system-update.irisfw dist/
          "$RUNNER_TEMP/iris-venv/bin/python" \
            submodule/esp-mosaico-utils/ESP-Iris/components/esp_iris/tools/esp_iris.py \
            bundle --json inspect dist/banco-system-update.irisfw | tee dist/banco-bundle-inspect.json
          sha256sum dist/banco-system-update.irisfw | tee dist/banco-system-update.irisfw.sha256
          ls -l dist

      - name: Upload the System Update bundle
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banco-irisfw
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banco-build-logs
          path: ${{ runner.temp }}/idf-logs/banco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: banco-firmware
          path: |
            projects/banco/build/*.bin
            projects/banco/build/*.elf
            projects/banco/build/*.map
            projects/banco/build/*.irisfw
            projects/banco/build/sdkconfig
            projects/banco/build/bootloader/*.bin
            projects/banco/build/partition_table/*.bin
            projects/banco/build/flasher_args.json
            projects/banco/build/flash_args
          if-no-files-found: error
          retention-days: 14
